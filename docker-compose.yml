# Optional: run a real Neo4j instance for the production graph backend.
# The system defaults to an in-memory graph store and works fully without
# this. To use Neo4j instead:
#   docker compose up -d
#   export GRAPH_BACKEND=neo4j NEO4J_URI=bolt://localhost:7687 NEO4J_PASSWORD=changeme-please
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    environment:
      - NEO4J_AUTH=neo4j/changeme-please
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
